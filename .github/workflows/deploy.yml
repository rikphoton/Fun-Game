name: Deploy NeonPulse Arcade to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: Automated Unit & Playwright Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci || npm install

      - name: Run Node Unit Tests
        run: npm test

      - name: Build Production Arcade (For E2E Testing)
        run: npm run build

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install chromium --with-deps

      - name: Run Playwright Browser Tests
        run: npm run test:browser

      - name: Verify Generated PWA Assets
        run: |
          node -e "
            const fs = require('fs');
            const required = [
              'dist/index.html',
              'dist/manifest.webmanifest',
              'dist/sw.js',
              'dist/favicon.ico',
              'dist/icons/icon-192.png',
              'dist/icons/icon-512.png',
              'dist/icons/icon-maskable-512.png',
              'dist/icons/apple-touch-icon.png'
            ];
            for (const file of required) {
              if (!fs.existsSync(file)) {
                console.error('Missing required release artifact: ' + file);
                process.exit(1);
              }
            }
            console.log('All required PWA assets verified in dist/');
          "

      - name: Upload Test Diagnostics Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: GitHub Pages Production Release
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci || npm install

      - name: Build Production Distribution
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-Release Verification
        run: |
          echo "Release successfully deployed to: ${{ steps.deployment.outputs.page_url }}"
          curl -sI "${{ steps.deployment.outputs.page_url }}" | head -n 5 || true
